# Catch-all virtual host for the existing WordPress folder.
# The host nginx (DSM) already picks the site by domain, so ServerName is informational.
<VirtualHost *:8080>
	ServerName localhost
	DocumentRoot ${WP_DIR}
	<Directory ${WP_DIR}>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
